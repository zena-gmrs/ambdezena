<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .text-overlay {
            position: absolute;
            bottom: 12%;
            width: 100%;
            text-align: center;
            color: #ffffff;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            font-size: 2rem;
            margin: 0;
            color: #ff4d6d;
            text-shadow: 0 0 15px rgba(255, 77, 109, 0.6);
        }

        p {
            font-size: 1.1rem;
            margin-top: 8px;
            color: #ffb3c1;
            text-shadow: 0 0 10px rgba(255, 179, 193, 0.4);
        }
    </style>
    <!-- Import Library Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div class="text-overlay">
        <!-- Kamu bisa ubah teks di bawah ini sesuai keinginan -->
        <h1>Happy Day, Sayang ❤️</h1>
        <p>Jantung ini berdetak cuma buat kamu.</p>
    </div>

    <script>
        // 1. Setup Scene, Kamera, dan Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. Pencahayaan
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff4d6d, 2, 50);
        pointLight.position.set(2, 3, 4);
        scene.add(pointLight);

        // 3. Membuat Bentuk Jantung 3D
        const heartShape = new THREE.Shape();
        const x = 0, y = 0;
        heartShape.moveTo(x + 0.25, y + 0.25);
        heartShape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
        heartShape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
        heartShape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 0.95);
        heartShape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
        heartShape.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
        heartShape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

        const extrudeSettings = {
            depth: 0.25,
            bevelEnabled: true,
            bevelSegments: 5,
            steps: 2,
            bevelSize: 0.1,
            bevelThickness: 0.1
        };

        const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        
        // Posisikan titik pusat ke tengah objek
        geometry.center();

        const material = new THREE.MeshPhongMaterial({
            color: 0xff0043,
            emissive: 0x330010,
            shininess: 100,
            specular: 0xffaaaa
        });

        const heart = new THREE.Mesh(geometry, material);
        // Memutar objek supaya posisi jantung berdiri normal
        heart.rotation.x = Math.PI;
        scene.add(heart);

        // 4. Efek Bintang/Partikel Berkelap-kelip di Background
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 600;
        const starPositions = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 20;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffb3c1,
            size: 0.03,
            transparent: true,
            opacity: 0.8
        });

        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // 5. Animasi (Rotasi, Detak Jantung, dan Respon Gerakan Mouse)
        let clock = new THREE.Clock();
        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth - 0.5) * 0.5;
            mouseY = (event.clientY / window.innerHeight - 0.5) * 0.5;
        });

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Efek Detak Jantung (Heartbeat) menggunakan fungsi Sinus
            const scale = 1 + Math.sin(elapsedTime * 4) * 0.08;
            heart.scale.set(scale, scale, scale);

            // Rotasi perlahan objek jantung
            heart.rotation.y += 0.01;

            // Efek interaksi kamera mengikuti pergerakan kursor/mouse
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            // Rotasi perlahan latar bintang
            starField.rotation.y -= 0.0005;

            renderer.render(scene, camera);
        }

        animate();

        // 6. Penyesuaian Ukuran Layar saat Layar di-Resize (Termasuk Tampilan HP)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
